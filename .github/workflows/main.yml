          package com.applock.pro;

          import android.accessibilityservice.AccessibilityService;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.PixelFormat;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.SystemClock;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.view.inputmethod.InputMethodInfo;
          import android.view.inputmethod.InputMethodManager;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import java.util.HashSet;
          import java.util.Set;

          final class Guard {
              static volatile String unlocked = null;
              static volatile String lockPkg = null;

              private static final Handler H = new Handler(Looper.getMainLooper());
              private static View cover;
              private static WindowManager coverWm;
              private static String lastPkg;
              private static long lastAt;
              private static Set<String> ime = new HashSet<>();
              private static long imeAt = 0;
              private static final Runnable HIDE = new Runnable() {
                  @Override public void run() { hideCover(); }
              };

              private static Set<String> imePkgs(Context c) {
                  long now = SystemClock.uptimeMillis();
                  if (imeAt == 0 || now - imeAt > 30000) {
                      Set<String> s = new HashSet<>();
                      try {
                          InputMethodManager m = (InputMethodManager) c.getSystemService(Context.INPUT_METHOD_SERVICE);
                          for (InputMethodInfo i : m.getEnabledInputMethodList()) s.add(i.getPackageName());
                      } catch (Exception ignored) { }
                      ime = s;
                      imeAt = now;
                  }
                  return ime;
              }

              // Called (on the main thread) whenever a new app window comes to the front.
              static void onFg(Context c, String pkg) {
                  if (pkg == null) return;
                  if (pkg.equals(c.getPackageName())) return;
                  if (pkg.equals("com.android.systemui") || pkg.equals("android")) return;
                  if (imePkgs(c).contains(pkg)) return;
                  String u = unlocked;
                  if (u != null && !u.equals(pkg)) {
                      unlocked = null;
                      u = null;
                  }
                  if (!Prefs.locked(c).contains(pkg) || pkg.equals(u)) return;
                  if (pkg.equals(lockPkg)) return;
                  long now = SystemClock.uptimeMillis();
                  if (pkg.equals(lastPkg) && now - lastAt < 500) return;
                  lastPkg = pkg;
                  lastAt = now;
                  showCover(c, pkg);
                  Intent i = new Intent(c, LockActivity.class)
                          .putExtra("pkg", pkg)
                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_NO_ANIMATION);
                  c.startActivity(i);
              }

              private static final java.util.HashMap<String, Long> ALLOW = new java.util.HashMap<>();

              static void allow(String key, long ms) {
                  ALLOW.put(key, SystemClock.uptimeMillis() + ms);
              }

              static boolean allowed(String key) {
                  Long t = ALLOW.get(key);
                  return t != null && SystemClock.uptimeMillis() < t.longValue();
              }

              // Asks for authentication before a locked feature (install, uninstall, internet, download...) can be used.
              static void gate(Context c, String key) {
                  if (allowed(key)) return;
                  if (key.equals(lockPkg)) return;
                  long now = SystemClock.uptimeMillis();
                  if (key.equals(lastPkg) && now - lastAt < 500) return;
                  lastPkg = key;
                  lastAt = now;
                  showCover(c, key);
                  Intent i = new Intent(c, LockActivity.class)
                          .putExtra("pkg", key)
                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_NO_ANIMATION);
                  c.startActivity(i);
              }

              static void showCover(Context c, String pkg) {
                  try {
                      int type;
                      if (Settings.canDrawOverlays(c)) type = WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY;
                      else if (c instanceof AccessibilityService) type = WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY;
                      else return;
                      hideCover();
                      LinearLayout v = new LinearLayout(c);
                      v.setOrientation(LinearLayout.VERTICAL);
                      v.setGravity(Gravity.CENTER);
                      v.setBackgroundColor(0xFF0F1B2D);
                      v.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                      ImageView ic = new ImageView(c);
                      TextView t = new TextView(c);
                      String label = pkg;
                      if (pkg.startsWith("feat:")) {
                          label = Prefs.featTitle(pkg);
                          ic.setImageResource(android.R.drawable.ic_lock_lock);
                      } else {
                          try {
                              PackageManager pm = c.getPackageManager();
                              label = pm.getApplicationLabel(pm.getApplicationInfo(pkg, 0)).toString();
                              ic.setImageDrawable(pm.getApplicationIcon(pkg));
                          } catch (Exception ignored) { }
                      }
                      t.setText(label + " قفل است");
                      t.setTextColor(0xFFFFFFFF);
                      t.setTextSize(20);
                      t.setGravity(Gravity.CENTER);
                      t.setPadding(0, Prefs.dp(c, 12), 0, 0);
                      v.addView(ic, new LinearLayout.LayoutParams(Prefs.dp(c, 88), Prefs.dp(c, 88)));
                      v.addView(t);
                      WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT,
                              type,
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                      | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                                      | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                              PixelFormat.OPAQUE);
                      WindowManager wm = (WindowManager) c.getSystemService(Context.WINDOW_SERVICE);
                      wm.addView(v, lp);
                      cover = v;
                      coverWm = wm;
                      H.postDelayed(HIDE, 4000);
                  } catch (Exception ignored) { }
              }

              static void hideCover() {
                  H.removeCallbacks(HIDE);
                  if (cover != null && coverWm != null) {
                      try { coverWm.removeView(cover); } catch (Exception ignored) { }
                  }
                  cover = null;
                  coverWm = null;
              }
          }
