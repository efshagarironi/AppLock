          package com.applock.pro;

          import android.accessibilityservice.AccessibilityService;
          import android.app.ActivityManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.PixelFormat;
          import android.graphics.drawable.Drawable;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.SystemClock;
          import android.provider.Settings;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.view.inputmethod.InputMethodInfo;
          import android.view.inputmethod.InputMethodManager;

          import java.util.HashSet;
          import java.util.Set;
          import java.util.concurrent.ConcurrentHashMap;

          // The lock screen is an overlay window (no activity, no animation, no recents card).
          final class Guard {
              static volatile String unlocked = null;
              static volatile String lockPkg = null;

              private static final Handler H = new Handler(Looper.getMainLooper());
              private static final ConcurrentHashMap<String, String> LABELS = new ConcurrentHashMap<>();
              private static final ConcurrentHashMap<String, Drawable> ICONS = new ConcurrentHashMap<>();
              private static LockPanel panel;      // currently visible
              private static LockPanel spare;      // pre-built, ready to show instantly
              private static WindowManager panelWm;
              private static long shownAt = 0;
              private static Set<String> ime = new HashSet<>();
              private static long imeAt = 0;

              private static Set<String> imePkgs(Context c) {
                  long now = SystemClock.uptimeMillis();
                  if (imeAt == 0 || now - imeAt > 30000) {
                      Set<String> s = new HashSet<>();
                      try {
                          InputMethodManager m = (InputMethodManager) c.getSystemService(Context.INPUT_METHOD_SERVICE);
                          for (InputMethodInfo i : m.getEnabledInputMethodList()) s.add(i.getPackageName());
                      } catch (Exception ignored) { }
                      ime = s;
                      imeAt = now;
                  }
                  return ime;
              }

              private static Set<String> homes = new HashSet<>();
              private static long homesAt = 0;

              private static boolean isHome(Context c, String pkg) {
                  long now = SystemClock.uptimeMillis();
                  if (homesAt == 0 || now - homesAt > 60000) {
                      Set<String> s = new HashSet<>();
                      try {
                          Intent h = new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME);
                          for (ResolveInfo ri : c.getPackageManager().queryIntentActivities(h, 0)) {
                              s.add(ri.activityInfo.packageName);
                          }
                      } catch (Exception ignored) { }
                      homes = s;
                      homesAt = now;
                  }
                  return homes.contains(pkg);
              }

              // System dialogs (permissions, installer...) can appear above a locked app: they must not remove the lock.
              private static boolean systemish(String pkg) {
                  return pkg.startsWith("com.android.") || pkg.contains("permissioncontroller") || pkg.contains("packageinstaller");
              }

              // ---------- warm-up: the lock screen is built before it is needed ----------
              private static LockPanel newPanel(Context c) {
                  return new LockPanel(c, null, false, new Runnable() {
                      @Override public void run() { authSuccess(); }
                  });
              }

              static void warm(Context c) {
                  try { if (spare == null) spare = newPanel(c); } catch (Exception ignored) { }
              }

              private static void load(PackageManager pm, String pkg) {
                  if (LABELS.containsKey(pkg) && ICONS.containsKey(pkg)) return;
                  try {
                      LABELS.put(pkg, pm.getApplicationLabel(pm.getApplicationInfo(pkg, 0)).toString());
                      ICONS.put(pkg, pm.getApplicationIcon(pkg));
                  } catch (Exception ignored) { }
              }

              static void cacheIcons(Context c) {
                  PackageManager pm = c.getPackageManager();
                  for (String p : Prefs.locked(c)) load(pm, p);
              }

              static void release() {
                  spare = null;
                  LABELS.clear();
                  ICONS.clear();
              }

              // Called (on the main thread) whenever a new app comes to the front. ts = time of the event.
              static void onFg(Context c, String pkg) {
                  onFg(c, pkg, System.currentTimeMillis());
              }

              static void onFg(Context c, String pkg, long ts) {
                  if (pkg == null) return;
                  if (pkg.equals(c.getPackageName())) return;
                  if (pkg.equals("com.android.systemui") || pkg.equals("android")) return;
                  if (imePkgs(c).contains(pkg)) return;
                  String u = unlocked;
                  if (u != null && !u.equals(pkg)) {
                      unlocked = null;
                      u = null;
                  }
                  boolean isLocked = Prefs.locked(c).contains(pkg);
                  if (panel != null && !pkg.equals(lockPkg)) {
                      // old events that were queued before the lock screen appeared must not remove it
                      if (ts < shownAt + 250) return;
                      if (!isLocked && (isHome(c, pkg) || !systemish(pkg))) {
                          leave(c);
                          return;
                      }
                  }
                  if (!isLocked || pkg.equals(u)) return;
                  if (panel != null && pkg.equals(lockPkg)) return;
                  if (panel != null) leave(c);
                  showLock(c, pkg);
              }

              static void showLock(Context c, String pkg) {
                  // accessibility overlay: instant, needs no extra permission, sits above everything
                  AccessibilityService acc = AppLockAccess.live ? AppLockAccess.instance : null;
                  if (acc == null && !Settings.canDrawOverlays(c)) return;
                  try {
                      load(c.getPackageManager(), pkg);
                      LockPanel p = spare != null ? spare : newPanel(c);
                      spare = null;
                      String label = LABELS.get(pkg);
                      p.bind(label != null ? label : pkg, ICONS.get(pkg));
                      WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT,
                              acc != null ? WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY
                                      : WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                                      | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                                      | WindowManager.LayoutParams.FLAG_FULLSCREEN
                                      | WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED,
                              PixelFormat.OPAQUE);
                      if (Build.VERSION.SDK_INT >= 28) {
                          lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      }
                      lp.windowAnimations = R.style.NoAnim;
                      WindowManager wm = (WindowManager) (acc != null ? acc : c).getSystemService(Context.WINDOW_SERVICE);
                      p.start();
                      wm.addView(p, lp);
                      panel = p;
                      panelWm = wm;
                      lockPkg = pkg;
                      shownAt = System.currentTimeMillis();
                  } catch (Exception ignored) { }
              }

              // Removes the lock screen (the view is kept for the next time).
              private static void removePanel() {
                  LockPanel p = panel;
                  WindowManager w = panelWm;
                  panel = null;
                  panelWm = null;
                  lockPkg = null;
                  if (p != null && w != null) {
                      try { w.removeView(p); } catch (Exception ignored) { }
                      spare = p;
                  }
              }

              static void hideLock() {
                  removePanel();
              }

              // The person left without unlocking: the locked app is closed so it does not stay open in the background.
              static void leave(Context c) {
                  String p = lockPkg;
                  removePanel();
                  if (p != null) kill(c, p);
              }

              private static void kill(Context c, final String pkg) {
                  final ActivityManager am = (ActivityManager) c.getApplicationContext().getSystemService(Context.ACTIVITY_SERVICE);
                  if (am == null) return;
                  long[] delays = {300, 1200};
                  for (long d : delays) {
                      H.postDelayed(new Runnable() {
                          @Override public void run() {
                              try {
                                  if (!pkg.equals(unlocked) && !pkg.equals(lockPkg)) am.killBackgroundProcesses(pkg);
                              } catch (Exception ignored) { }
                          }
                      }, d);
                  }
              }

              static void authSuccess() {
                  String p = lockPkg;
                  if (p != null) unlocked = p;
                  removePanel();
              }

              static void goHome(Context c) {
                  leave(c);
                  Intent h = new Intent(Intent.ACTION_MAIN);
                  h.addCategory(Intent.CATEGORY_HOME);
                  h.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  c.startActivity(h);
              }

              static void fallbackPattern(String msg) {
                  LockPanel p = panel;
                  if (p != null) p.fallbackPattern(msg);
              }
          }
