              private void load() {
                  new Thread(new Runnable() {
                      @Override public void run() {
                          PackageManager pm = getPackageManager();
                          Intent mi = new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER);
                          Set<String> locked = Prefs.locked(MainActivity.this);
                          Set<String> seen = new HashSet<>();
                          final List<Item> l = new ArrayList<>();
                          for (ResolveInfo ri : pm.queryIntentActivities(mi, 0)) {
                              String p = ri.activityInfo.packageName;
                              if (p.equals(getPackageName()) || !seen.add(p)) continue;
                              Item it = new Item();
                              it.pkg = p;
                              it.label = String.valueOf(ri.loadLabel(pm));
                              it.icon = ri.loadIcon(pm);
                              it.locked = locked.contains(p);
                              l.add(it);
                          }
                          final Collator col = Collator.getInstance();
                          Collections.sort(l, new Comparator<Item>() {
                              @Override public int compare(Item a, Item b) { return col.compare(a.label, b.label); }
                          });
                          runOnUiThread(new Runnable() {
                              @Override public void run() {
                                  all.clear();
                                  all.addAll(l);
                                  filter();
                              }
                          });
                      }
                  }).start();
              }

              private void filter() {
                  if (search == null || ad == null) return;
                  String q = search.getText().toString().trim().toLowerCase();
                  shown.clear();
                  for (Item it : all) {
                      if (q.isEmpty() || it.label.toLowerCase().contains(q) || it.pkg.toLowerCase().contains(q)) {
                          shown.add(it);
                      }
                  }
                  ad.notifyDataSetChanged();
                  updateCount();
              }

              private void updateCount() {
                  int n = 0;
                  for (Item it : all) if (it.locked) n++;
                  count.setText("قفل‌شده: " + n + " از " + all.size() + " برنامه");
              }

              class Adapter extends RecyclerView.Adapter<Adapter.VH> {
                  class VH extends RecyclerView.ViewHolder {
                      ImageView ic;
                      TextView tv;
                      CheckBox cb;
                      VH(View v, ImageView i, TextView t, CheckBox c) {
                          super(v);
                          ic = i; tv = t; cb = c;
                      }
                  }

                  @Override public VH onCreateViewHolder(ViewGroup p, int t) {
                      LinearLayout row = new LinearLayout(MainActivity.this);
                      row.setOrientation(LinearLayout.HORIZONTAL);
                      row.setGravity(Gravity.CENTER_VERTICAL);
                      row.setBackgroundColor(Color.WHITE);
                      row.setPadding(dp(16), dp(10), dp(16), dp(10));
                      RecyclerView.LayoutParams rlp = new RecyclerView.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                      rlp.bottomMargin = 2;
                      row.setLayoutParams(rlp);
                      ImageView ic = new ImageView(MainActivity.this);
                      row.addView(ic, new LinearLayout.LayoutParams(dp(44), dp(44)));
                      TextView tv = new TextView(MainActivity.this);
                      tv.setTextSize(16);
                      tv.setTextColor(0xFF1A1A1A);
                      tv.setPadding(dp(12), 0, dp(12), 0);
                      row.addView(tv, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));
                      CheckBox cb = new CheckBox(MainActivity.this);
                      cb.setClickable(false);
                      cb.setFocusable(false);
                      row.addView(cb);
                      return new VH(row, ic, tv, cb);
                  }

                  @Override public void onBindViewHolder(final VH h, int pos) {
                      final Item it = shown.get(pos);
                      h.ic.setImageDrawable(it.icon);
                      h.tv.setText(it.label);
                      h.cb.setChecked(it.locked);
                      h.itemView.setOnClickListener(new View.OnClickListener() {
                          @Override public void onClick(View v) {
                              it.locked = !it.locked;
                              Prefs.setLocked(MainActivity.this, it.pkg, it.locked);
                              h.cb.setChecked(it.locked);
                              updateCount();
                          }
                      });
                  }

                  @Override public int getItemCount() { return shown.size(); }
              }

              // ---------- permissions ----------
              private void refreshPerms() {
                  if (banner == null) return;
                  boolean overlay = Settings.canDrawOverlays(this);
                  boolean acc = Prefs.accEnabled(this);
                  boolean ok = overlay && (Prefs.accMode(this) ? acc : Prefs.hasUsage(this));
                  banner.setVisibility(ok ? View.GONE : View.VISIBLE);
                  if (overlay && (acc || Prefs.hasUsage(this)) && !LockService.running) {
                      startForegroundService(new Intent(this, LockService.class));
                  }
                  if (ok) {
                      if (Build.VERSION.SDK_INT >= 33 && !askedNotif
                              && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          askedNotif = true;
                          requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 1);
                      }
                  } else if (!asked) {
                      asked = true;
                      requestNext();
                  }
              }

              private void requestNext() {
                  if (!Settings.canDrawOverlays(this)) {
                      ask("نمایش روی سایر برنامه‌ها",
                              "برای نمایش صفحه قفل روی برنامه‌های قفل‌شده این دسترسی لازم است. در صفحه بعد «قفل برنامه» را روشن کنید.",
                              new Runnable() {
                                  @Override public void run() {
                                      leaving = true;
                                      startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                              Uri.parse("package:" + getPackageName())));
                                  }
                              });
                  } else if (!Prefs.accMode(this) && !Prefs.hasUsage(this)) {
                  ask("دسترسی به آمار استفاده",
                          "برای تشخیص اینکه کدام برنامه باز شده این دسترسی لازم است. در صفحه بعد «قفل برنامه» را پیدا و روشن کنید. (با روشن کردن «حالت دسترس‌پذیری» در تنظیمات، باز شدن قفل سریع‌تر می‌شود.)",
                          new Runnable() {
                              @Override public void run() {
                                  leaving = true;
                                  startActivity(new Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS));
                              }
                          });
              } else if (Prefs.accMode(this) && !Prefs.accEnabled(this)) {
                      ask("سرویس دسترسی‌پذیری",
                              "برای اینکه صفحه قفل بدون هیچ تأخیری و قبل از دیده شدن برنامه باز شود، این سرویس لازم است. در صفحه بعد «قفل برنامه» را پیدا و روشن کنید. هیچ اطلاعاتی خوانده یا ذخیره نمی‌شود.\n\nاگر گزینه خاکستری بود: تنظیمات گوشی > برنامه‌ها > قفل برنامه > منوی ⋮ بالا > «اجازه تنظیمات محدودشده» را بزنید و دوباره تلاش کنید.",
                              new Runnable() {
                                  @Override public void run() {
                                      leaving = true;
                                      startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                                  }
                              });
                  }
              }

              private void ask(String t, String m, final Runnable r) {
                  new AlertDialog.Builder(this)
                          .setTitle(t)
                          .setMessage(m)
                          .setPositiveButton("باز کردن تنظیمات", new DialogInterface.OnClickListener() {
                              @Override public void onClick(DialogInterface d, int w) { r.run(); }
                          })
                          .setNegativeButton("بعداً", null)
                          .show();
              }

              // ---------- settings ----------
              private void settingsDialog() {
                  String[] items = {
                          "روش باز کردن برنامه‌های قفل‌شده: " + Prefs.METHODS[Prefs.appMethod(this)],
                          "روش ورود به همین برنامه: " + Prefs.METHODS[Prefs.selfMethod(this)],
                          "قفل ورود به همین برنامه: " + (Prefs.selfLock(this) ? "روشن" : "خاموش"),
                          "حالت دسترس‌پذیری (باز شدن سریع‌تر): " + (Prefs.accMode(this) ? "روشن" : "خاموش"),
                          "زمان بررسی باز شدن اپ‌ها: " + Prefs.pollMs(this) + " میلی‌ثانیه",
                          "تغییر الگو",
                          "پشتیبان",
                          "بررسی دسترسی‌ها"
                  };
                  new AlertDialog.Builder(this)
                          .setTitle("تنظیمات")
                          .setItems(items, new DialogInterface.OnClickListener() {
                              @Override public void onClick(DialogInterface d, int w) {
                                  if (w == 0) pickMethod(false);
                                  else if (w == 1) pickMethod(true);
                                  else if (w == 2) {
                                      boolean nv = !Prefs.selfLock(MainActivity.this);
                                      Prefs.setSelfLock(MainActivity.this, nv);
                                      if (nv) selfOk = true;
                                      toast(nv ? "قفل ورود روشن شد" : "قفل ورود خاموش شد");
                                  } else if (w == 3) {
                                  boolean nv = !Prefs.accMode(MainActivity.this);
                                  Prefs.setAccMode(MainActivity.this, nv);
                                  asked = false;
                                  toast(nv ? "حالت دسترس‌پذیری روشن شد" : "حالت دسترس‌پذیری خاموش شد");
                                  refreshPerms();
                              } else if (w == 4) pollDialog();
                                  else if (w == 5) patternSetup(true);
                                  else if (w == 6) backupDialog();
                                  else {
                                      asked = false;
                                      if (Settings.canDrawOverlays(MainActivity.this) && (Prefs.accMode(MainActivity.this) ? Prefs.accEnabled(MainActivity.this) : Prefs.hasUsage(MainActivity.this))) {
                                          toast("همه دسترسی‌ها داده شده است");
                                      } else {
                                          requestNext();
                                      }
                                  }
                              }
                          })
                          .show();
              }

              private void pollDialog() {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(dp(24), dp(16), dp(24), dp(8));
                  final TextView t = new TextView(this);
                  t.setGravity(Gravity.CENTER);
                  t.setTextSize(18);
                  t.setText(Prefs.pollMs(this) + " میلی‌ثانیه");
                  final SeekBar sb = new SeekBar(this);
                  sb.setMax(88);
                  sb.setProgress(Prefs.pollMs(this) - 2);
                  sb.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override public void onProgressChanged(SeekBar s, int p, boolean user) {
                          int ms = p + 2;
                          t.setText(ms + " میلی‌ثانیه");
                          Prefs.setPollMs(MainActivity.this, ms);
                      }
                      @Override public void onStartTrackingTouch(SeekBar s) { }
                      @Override public void onStopTrackingTouch(SeekBar s) { }
                  });
                  TextView note = new TextView(this);
                  note.setText("اهرم را بکشید تا فاصله زمانی بررسی بین ۲ تا ۹۰ میلی‌ثانیه تغییر کند. عدد کمتر یعنی تشخیص سریع‌تر ولی مصرف باتری و پردازنده بیشتر. این تنظیم فقط وقتی «حالت دسترس‌پذیری» خاموش است اثر دارد.");
                  note.setTextSize(12);
                  note.setPadding(0, dp(12), 0, 0);
                  box.addView(t);
                  box.addView(sb);
                  box.addView(note);
                  new AlertDialog.Builder(this)
                          .setTitle("زمان بررسی باز شدن اپ‌ها")
                          .setView(box)
                          .setPositiveButton("تأیید", null)
                          .show();
              }

              private void pickMethod(final boolean self) {
                  int cur = self ? Prefs.selfMethod(this) : Prefs.appMethod(this);
                  new AlertDialog.Builder(this)
                          .setTitle(self ? "روش ورود به همین برنامه" : "روش باز کردن برنامه‌های قفل‌شده")
                          .setSingleChoiceItems(Prefs.METHODS, cur, new DialogInterface.OnClickListener() {
                              @Override public void onClick(DialogInterface d, int w) {
                                  if (self) Prefs.setSelfMethod(MainActivity.this, w);
                                  else Prefs.setAppMethod(MainActivity.this, w);
                                  d.dismiss();
                              }
                          })
                          .show();
              }

              private void patternSetup(boolean cancelable) {
                  final PatternView p = new PatternView(this);
                  final TextView t = new TextView(this);
                  t.setText("الگوی خود را بکشید (حداقل ۴ نقطه)");
                  t.setGravity(Gravity.CENTER);
                  t.setPadding(0, dp(8), 0, dp(12));
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setGravity(Gravity.CENTER_HORIZONTAL);
                  box.setPadding(dp(16), dp(8), dp(16), dp(8));
                  box.addView(t);
                  box.addView(p, new LinearLayout.LayoutParams(dp(260), dp(260)));
                  AlertDialog.Builder bd = new AlertDialog.Builder(this)
                          .setTitle("ساخت الگو")
                          .setView(box)
                          .setCancelable(cancelable);
                  if (cancelable) bd.setNegativeButton("انصراف", null);
                  final AlertDialog d = bd.create();
                  final String[] first = new String[1];
                  p.listener = new PatternView.Listener() {
                      @Override public void onDone(String code) {
                          if (code.length() < 4) {
                              t.setText("حداقل ۴ نقطه را وصل کنید");
                              p.clearLater();
                          } else if (first[0] == null) {
                              first[0] = code;
                              t.setText("الگو را یک بار دیگر بکشید");
                              p.clearLater();
                          } else if (first[0].equals(code)) {
                              Prefs.setPattern(MainActivity.this, code);
                              selfOk = true;
                              d.dismiss();
                              toast("الگو ذخیره شد");
                          } else {
                              first[0] = null;
                              t.setText("الگوها یکسان نبودند؛ از اول بکشید");
                              p.clearLater();
                          }
                      }
                  };
                  d.show();
              }

              // ---------- backup ----------
              private boolean hasFolder() {
                  return Prefs.sp(this).getString("backup_tree", null) != null;
              }

              private String buildJson() throws Exception {
                  JSONObject o = new JSONObject();
                  o.put("version", 1);
                  o.put("locked", new JSONArray(Prefs.locked(this)));
                  o.put("app_method", Prefs.appMethod(this));
                  o.put("self_method", Prefs.selfMethod(this));
                  o.put("self_lock", Prefs.selfLock(this));
                  return o.toString(2);
              }

              private void restoreFrom(Uri u) throws Exception {
                  InputStream is = getContentResolver().openInputStream(u);
                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                  byte[] buf = new byte[4096];
                  int n;
                  while ((n = is.read(buf)) > 0) bo.write(buf, 0, n);
                  is.close();
                  JSONObject o = new JSONObject(bo.toString("UTF-8"));
                  Set<String> s = new HashSet<>();
                  JSONArray a = o.getJSONArray("locked");
                  for (int k = 0; k < a.length(); k++) s.add(a.getString(k));
                  Prefs.sp(this).edit()
                          .putStringSet("locked", s)
                          .putInt("app_method", o.optInt("app_method", 0))
                          .putInt("self_method", o.optInt("self_method", 0))
                          .putBoolean("self_lock", o.optBoolean("self_lock", true))
                          .apply();
                  load();
              }

              private void pickFolder(int pend) {
                  pending = pend;
                  leaving = true;
                  toast("پوشه‌ای برای ذخیره پشتیبان‌ها انتخاب کنید");
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE);
                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                          | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
                  startActivityForResult(i, 103);
              }

              private boolean writeBackup() {
                  String t = Prefs.sp(this).getString("backup_tree", null);
                  if (t == null) return false;
                  try {
                      Uri tree = Uri.parse(t);
                      Uri parent = DocumentsContract.buildDocumentUriUsingTree(tree, DocumentsContract.getTreeDocumentId(tree));
                      String name = "applock-" + new SimpleDateFormat("yyyyMMdd-HHmmss", Locale.US).format(new Date()) + ".json";
                      Uri f = DocumentsContract.createDocument(getContentResolver(), parent, "application/json", name);
                      if (f == null) return false;
                      OutputStream os = getContentResolver().openOutputStream(f);
                      os.write(buildJson().getBytes("UTF-8"));
                      os.close();
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }

              private void doBackup() {
                  if (hasFolder() && writeBackup()) toast("پشتیبان ذخیره شد");
                  else pickFolder(1);
              }

              private void queryBackups(List<Uri> uris, List<String> names) {
                  String t = Prefs.sp(this).getString("backup_tree", null);
                  if (t == null) return;
                  try {
                      Uri tree = Uri.parse(t);
                      Uri ch = DocumentsContract.buildChildDocumentsUriUsingTree(tree, DocumentsContract.getTreeDocumentId(tree));
                      Cursor c = getContentResolver().query(ch, new String[]{
                              DocumentsContract.Document.COLUMN_DOCUMENT_ID,
                              DocumentsContract.Document.COLUMN_DISPLAY_NAME}, null, null, null);
                      List<String[]> rows = new ArrayList<>();
                      if (c != null) {
                          while (c.moveToNext()) {
                              String n = c.getString(1);
                              if (n != null && n.endsWith(".json")) rows.add(new String[]{c.getString(0), n});
                          }
                          c.close();
                      }
                      Collections.sort(rows, new Comparator<String[]>() {
                          @Override public int compare(String[] a, String[] b) { return b[1].compareTo(a[1]); }
                      });
                      for (String[] r : rows) {
                          uris.add(DocumentsContract.buildDocumentUriUsingTree(tree, r[0]));
                          names.add(r[1]);
                      }
                  } catch (Exception ignored) { }
              }

              private void backupDialog() {
                  String[] it = {
                          "پشتیبان‌گیری از تنظیمات",
                          "بازیابی تنظیمات از پشتیبان\n(نگه دارید تا لیست پشتیبان‌ها باز شود)"
                  };
                  final AlertDialog d = new AlertDialog.Builder(this)
                          .setTitle("پشتیبان")
                          .setItems(it, new DialogInterface.OnClickListener() {
                              @Override public void onClick(DialogInterface di, int w) {
                                  if (w == 0) {
                                      doBackup();
                                  } else {
                                      leaving = true;
                                      Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                                      i.addCategory(Intent.CATEGORY_OPENABLE);
                                      i.setType("*/*");
                                      startActivityForResult(i, 102);
                                  }
                              }
                          })
                          .create();
                  d.show();
                  d.getListView().setOnItemLongClickListener(new AdapterView.OnItemLongClickListener() {
                      @Override public boolean onItemLongClick(AdapterView<?> p, View v, int pos, long id) {
                          if (pos == 1) {
                              d.dismiss();
                              if (hasFolder()) backupList(); else pickFolder(2);
                              return true;
                          }
                          return false;
                      }
                  });
              }

              private void backupList() {
                  final List<Uri> uris = new ArrayList<>();
                  final List<String> names = new ArrayList<>();
                  queryBackups(uris, names);
                  if (names.isEmpty()) {
                      toast("هیچ فایل پشتیبانی در پوشه انتخاب‌شده پیدا نشد");
                      return;
                  }
                  final boolean[] on = new boolean[names.size()];
                  new AlertDialog.Builder(this)
                          .setTitle("فایل‌های پشتیبان")
                          .setMultiChoiceItems(names.toArray(new String[0]), on, new DialogInterface.OnMultiChoiceClickListener() {
                              @Override public void onClick(DialogInterface d, int w, boolean c) { on[w] = c; }
                          })
                          .setPositiveButton("بازیابی", new DialogInterface.OnClickListener() {
                              @Override public void onClick(DialogInterface d, int w) {
                                  int n = 0, idx = -1;
                                  for (int k = 0; k < on.length; k++) if (on[k]) { n++; idx = k; }
                                  if (n != 1) {
                                      toast("برای بازیابی دقیقاً یک فایل را تیک بزنید");
                                      backupList();
                                      return;
                                  }
                                  try {
                                      restoreFrom(uris.get(idx));
                                      toast("تنظیمات بازیابی شد");
                                  } catch (Exception e) {
                                      toast("خطا: فایل پشتیبان معتبر نیست");
                                  }
                              }
                          })
                          .setNeutralButton("حذف", new DialogInterface.OnClickListener() {
                              @Override public void onClick(DialogInterface d, int w) {
                                  int n = 0;
                                  for (boolean b : on) if (b) n++;
                                  if (n == 0) {
                                      toast("ابتدا فایل‌ها را تیک بزنید");
                                      backupList();
                                      return;
                                  }
                                  final int cnt = n;
                                  new AlertDialog.Builder(MainActivity.this)
                                          .setTitle("حذف پشتیبان")
                                          .setMessage(cnt + " فایل انتخاب‌شده حذف شود؟")
                                          .setPositiveButton("حذف", new DialogInterface.OnClickListener() {
                                              @Override public void onClick(DialogInterface d2, int w2) {
                                                  for (int k = 0; k < on.length; k++) {
                                                      if (on[k]) {
                                                          try {
                                                              DocumentsContract.deleteDocument(getContentResolver(), uris.get(k));
                                                          } catch (Exception ignored) { }
                                                      }
                                                  }
                                                  toast(cnt + " فایل حذف شد");
                                                  backupList();
                                              }
                                          })
                                          .setNegativeButton("انصراف", null)
                                          .show();
                              }
                          })
                          .setNegativeButton("بستن", null)
                          .show();
              }

              @Override protected void onActivityResult(int rc, int res, Intent data) {
                  super.onActivityResult(rc, res, data);
                  if (res != RESULT_OK || data == null || data.getData() == null) {
                      pending = 0;
                      return;
                  }
                  Uri u = data.getData();
                  try {
                      if (rc == 102) {
                          restoreFrom(u);
                          toast("تنظیمات بازیابی شد");
                      } else if (rc == 103) {
                          getContentResolver().takePersistableUriPermission(u,
                                  Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);
                          Prefs.sp(this).edit().putString("backup_tree", u.toString()).apply();
                          int p = pending;
                          pending = 0;
                          if (p == 1) toast(writeBackup() ? "پشتیبان ذخیره شد" : "ذخیره پشتیبان ناموفق بود");
                          else if (p == 2) backupList();
                      }
                  } catch (Exception e) {
                      toast("خطا: فایل پشتیبان معتبر نیست");
                  }
              }
          }
