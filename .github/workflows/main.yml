              private static final String[] MUS = norm("download audio", "download music", "download song", "save audio",
                      "save to music", "دانلود موزیک", "دانلود آهنگ", "دانلود صوت", "ذخیره آهنگ", "ذخیره صوت");
              private static final String[] APP = norm("download app", "download apk", "دانلود برنامه", "دانلود اپ", "دانلود apk");
              private static final String[] GEN = norm("download", "download file", "download link", "save to gallery",
                      "save to downloads", "دانلود", "دانلود فایل", "دانلود لینک", "ذخیره در گالری", "ذخیره در دانلودها");

              private final Handler h = new Handler(Looper.getMainLooper());
              private final List<View> shields = new ArrayList<>();
              private String shieldSig = "";
              private String watchPkg = "";
              private boolean scheduled = false;
              private volatile boolean featOn = false;

              private final Runnable scan = new Runnable() {
                  @Override public void run() {
                      try { doScan(); } catch (Exception ignored) { }
                  }
              };
              private final Runnable keep = new Runnable() {
                  @Override public void run() {
                      try { doScan(); } catch (Exception ignored) { }
                  }
              };

              // ---------- helpers ----------
              private static String squash(CharSequence cs) {
                  if (cs == null) return "";
                  String s = cs.toString().toLowerCase();
                  StringBuilder b = new StringBuilder();
                  for (int i = 0; i < s.length(); i++) {
                      char ch = s.charAt(i);
                      if (Character.isWhitespace(ch) || ch == '\u200c' || ch == '\u200e' || ch == '\u200f'
                              || ch == '\u00a0' || ch == '-' || ch == '_' || ch == '\u2010' || ch == '\u2011'
                              || ch == '\u2012' || ch == '\u2013') continue;
                      if (ch == '\u064a') ch = '\u06cc';
                      else if (ch == '\u0643') ch = '\u06a9';
                      b.append(ch);
                  }
                  return b.toString();
              }

              private static String[] norm(String... a) {
                  String[] r = new String[a.length];
                  for (int i = 0; i < a.length; i++) r[i] = squash(a[i]);
                  return r;
              }

              private static boolean hasAny(String s, String[] a) {
                  for (String k : a) if (!k.isEmpty() && s.contains(k)) return true;
                  return false;
              }

              private static boolean startsAny(String s, String[] a) {
                  for (String k : a) if (!k.isEmpty() && s.startsWith(k)) return true;
                  return false;
              }

              private static boolean inList(String s, String[] a) {
                  for (String k : a) if (k.equals(s)) return true;
                  return false;
              }

              // ---------- service lifecycle ----------
              @Override protected void onServiceConnected() {
                  super.onServiceConnected();
                  connected = true;
                  inst = this;
                  applyConfig();
              }

              @Override public boolean onUnbind(Intent i) {
                  connected = false;
                  inst = null;
                  h.removeCallbacksAndMessages(null);
                  clearShields();
                  return super.onUnbind(i);
              }

              // Called from the settings screen when a feature lock is switched on or off.
              static void reconfig() {
                  LockAccessibility s = inst;
                  if (s != null) s.applyConfig();
              }

              private void applyConfig() {
                  featOn = Prefs.anyFeat(this);
                  try {
                      AccessibilityServiceInfo info = getServiceInfo();
                      if (info != null) {
                          int types = AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED;
                          if (featOn) {
                              types |= AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED | AccessibilityEvent.TYPE_VIEW_SCROLLED;
                          }
                          info.eventTypes = types;
                          setServiceInfo(info);
                      }
                  } catch (Exception ignored) { }
                  if (!featOn) clearShields();
              }

              // ---------- events ----------
              @Override public void onAccessibilityEvent(AccessibilityEvent e) {
                  if (e == null) return;
                  CharSequence p = e.getPackageName();
                  if (p == null) return;
                  String pkg = p.toString();
                  int t = e.getEventType();
                  if (t == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) {
                      if (featOn) {
                          if (pkg.equals(getPackageName())) {
                              clearShields();
                          } else {
                              try { checkWindow(pkg, e); } catch (Exception ignored) { }
                              requestScan(pkg);
                          }
                      }
                      if (!Prefs.accMode(this)) return;
                      Guard.onFg(this, pkg);
                  } else if (featOn && (t == AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED
                          || t == AccessibilityEvent.TYPE_VIEW_SCROLLED)) {
                      if (!pkg.equals(getPackageName())) requestScan(pkg);
                  }
              }

              @Override public void onInterrupt() { }

              // Whole-screen gates: package installer (install / uninstall), network settings, device-admin settings.
              private void checkWindow(String pkg, AccessibilityEvent e) {
                  String cls = squash(e.getClassName());
                  if (pkg.contains("packageinstaller")) {
                      if (!Prefs.feat(this, "install") && !Prefs.feat(this, "uninstall")) return;
                      if (cls.contains("uninstall")) {
                          if (Prefs.feat(this, "uninstall")) Guard.gate(this, "feat:uninstall");
                      } else if (cls.contains("install")) {
                          if (Prefs.feat(this, "install")) Guard.gate(this, "feat:install");
                      } else {
                          checkInstaller(0);
                      }
                      return;
                  }
                  if (pkg.equals("com.android.settings")) {
                      StringBuilder sb = new StringBuilder(cls);
                      for (CharSequence c : e.getText()) sb.append('|').append(squash(c));
                      sb.append('|').append(squash(e.getContentDescription()));
                      String all = sb.toString();
                      if (Prefs.protectSelf(this) && (all.contains("deviceadmin") || hasAny(all, ADMIN))) {
                          Guard.gate(this, "feat:admin");
                          return;
                      }
                      if (Prefs.feat(this, "net") && hasAny(all, SET_NET)) Guard.gate(this, "feat:net");
                  }
              }

              // Some systems report a dialog class name, so the installer window is classified by its text.
              private void checkInstaller(final int attempt) {
                  String kind = kindFromWindow();
                  if (kind == null) return;
                  if (kind.equals("u")) {
                      if (Prefs.feat(this, "uninstall")) Guard.gate(this, "feat:uninstall");
                  } else if (kind.equals("i")) {
                      if (Prefs.feat(this, "install")) Guard.gate(this, "feat:install");
                  } else if (attempt < 3) {
                      h.postDelayed(new Runnable() {
                          @Override public void run() { checkInstaller(attempt + 1); }
                      }, 300);
                  }
              }

              private String kindFromWindow() {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return "";
                  CharSequence rp = root.getPackageName();
                  if (rp == null || !rp.toString().contains("packageinstaller")) return null;
                  StringBuilder sb = new StringBuilder();
                  gather(root, sb, new int[]{150});
                  String s = sb.toString();
                  if (s.contains("uninstall") || s.contains("حذف")) return "u";
                  if (s.contains("install") || s.contains("update") || s.contains("نصب")
                          || s.contains("بهروزرسانی") || s.contains("بروزرسانی")) return "i";
                  return "";
              }

              private void gather(AccessibilityNodeInfo n, StringBuilder sb, int[] budget) {
                  if (n == null || budget[0] <= 0) return;
                  budget[0]--;
                  sb.append(squash(n.getText())).append('|').append(squash(n.getContentDescription())).append('|');
                  int c = n.getChildCount();
                  for (int i = 0; i < c; i++) gather(n.getChild(i), sb, budget);
              }

              // ---------- button shields (internet tiles, store install buttons, download buttons) ----------
              private void requestScan(String pkg) {
                  watchPkg = pkg;
                  if (scheduled) return;
                  scheduled = true;
                  h.postDelayed(scan, 120);
              }

              private void doScan() {
                  scheduled = false;
                  if (!featOn) {
                      clearShields();
                      return;
                  }
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) {
                      clearShields();
                      return;
                  }
                  String pkg = String.valueOf(root.getPackageName());
                  boolean sys = pkg.equals("com.android.systemui");
                  boolean store = STORES.contains(pkg);
                  boolean dl = Prefs.anyDl(this);
                  boolean use;
                  if (pkg.equals(getPackageName()) || pkg.equals("com.android.settings")) use = false;
                  else if (sys) use = Prefs.feat(this, "net");
                  else if (store) use = dl || Prefs.feat(this, "install");
                  else use = dl;

                  List<Hit> hits = new ArrayList<>();
                  if (use) {
                      int sh = getResources().getDisplayMetrics().heightPixels;
                      collect(root, sys, store, new int[]{600}, hits, sh);
                  }
                  StringBuilder sig = new StringBuilder();
                  for (Hit ht : hits) sig.append(ht.key).append(ht.r.flattenToString()).append(';');
                  String s = sig.toString();
                  if (!s.equals(shieldSig) || (!hits.isEmpty() && shields.isEmpty())) {
                      clearShields();
                      for (Hit ht : hits) {
                          try { addShield(ht); } catch (Exception ignored) { }
                      }
                      shieldSig = s;
                  }
                  if (!shields.isEmpty()) {
                      h.removeCallbacks(keep);
                      h.postDelayed(keep, 1000);
                  }
              }

              private void collect(AccessibilityNodeInfo n, boolean sys, boolean store, int[] budget, List<Hit> out, int sh) {
                  if (n == null || budget[0] <= 0) return;
                  budget[0]--;
                  if (n.isVisibleToUser()) {
                      String key = sys ? netKey(n) : dlKey(n, store);
                      if (key != null && !Guard.allowed(key)) {
                          AccessibilityNodeInfo c = clickableOf(n);
                          if (c != null) {
                              Rect r = new Rect();
                              c.getBoundsInScreen(r);
                              if (r.width() > 8 && r.height() > 8 && r.height() < sh * 0.4f) {
                                  boolean dup = false;
                                  for (Hit o : out) if (o.r.equals(r)) dup = true;
                                  if (!dup) {
                                      Hit ht = new Hit();
                                      ht.r = r;
                                      ht.key = key;
                                      out.add(ht);
                                  }
                              }
                          }
                      }
                  }
                  int cnt = n.getChildCount();
                  for (int i = 0; i < cnt && budget[0] > 0; i++) collect(n.getChild(i), sys, store, budget, out, sh);
              }

              private AccessibilityNodeInfo clickableOf(AccessibilityNodeInfo n) {
                  AccessibilityNodeInfo c = n;
                  for (int i = 0; i < 5 && c != null; i++) {
                      if (c.isClickable()) return c;
                      c = c.getParent();
                  }
                  return null;
              }

              private String netKey(AccessibilityNodeInfo n) {
                  if (!Prefs.feat(this, "net")) return null;
                  String a = squash(n.getText());
                  String b = squash(n.getContentDescription());
                  if (startsAny(a, NET) || startsAny(b, NET)) return "feat:net";
                  return null;
              }

              private String dlKey(AccessibilityNodeInfo n, boolean store) {
                  String k = keyFor(squash(n.getText()), store);
                  if (k == null) k = keyFor(squash(n.getContentDescription()), store);
                  return k;
              }

              private String keyFor(String s, boolean store) {
                  if (s.isEmpty() || s.length() > 60) return null;
                  if (store && inList(s, STORE_BTN)) {
                      if (Prefs.feat(this, "install")) return "feat:install";
                      if (Prefs.feat(this, "dl_app")) return "feat:dl_app";
                  }
                  if (startsAny(s, IMG)) return Prefs.feat(this, "dl_image") ? "feat:dl_image" : null;
                  if (startsAny(s, VID)) return Prefs.feat(this, "dl_video") ? "feat:dl_video" : null;
                  if (startsAny(s, MUS)) return Prefs.feat(this, "dl_music") ? "feat:dl_music" : null;
                  if (startsAny(s, APP)) return Prefs.feat(this, "dl_app") ? "feat:dl_app" : null;
                  if (inList(s, GEN)) return Prefs.anyDl(this) ? "feat:dl_any" : null;
                  return null;
              }

              private void addShield(Hit ht) {
                  final String key = ht.key;
                  View v = new View(this);
                  v.setBackgroundColor(0x22FF9800);
                  v.setOnTouchListener(new View.OnTouchListener() {
                      @Override public boolean onTouch(View view, MotionEvent ev) {
                          if (ev.getAction() == MotionEvent.ACTION_UP) {
                              h.post(new Runnable() {
                                  @Override public void run() {
                                      clearShields();
                                      if (Guard.allowed(key)) requestScan(watchPkg);
                                      else Guard.gate(LockAccessibility.this, key);
                                  }
                              });
                          }
                          return true;
                      }
                  });
                  WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                          ht.r.width(), ht.r.height(),
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                          PixelFormat.TRANSLUCENT);
                  lp.gravity = Gravity.TOP | Gravity.START;
                  lp.x = ht.r.left;
                  lp.y = ht.r.top;
                  WindowManager wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  wm.addView(v, lp);
                  shields.add(v);
              }

              private void clearShields() {
                  h.removeCallbacks(keep);
                  shieldSig = "";
                  if (shields.isEmpty()) return;
                  WindowManager wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  for (View v : shields) {
                      try { wm.removeView(v); } catch (Exception ignored) { }
                  }
                  shields.clear();
              }
          }
