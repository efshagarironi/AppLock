                  count.setText("قفل‌شده: " + n + " از " + all.size() + " برنامه");
                  if (chipLocked != null) chipLocked.setText(String.valueOf(n));
                  if (chipFree != null) chipFree.setText(String.valueOf(all.size() - n));
              }

              // Small drawn padlock: closed (locked apps) or open (unlocked apps).
              static class LockIcon extends Drawable {
                  private final boolean open;
                  private final int size;
                  private final android.graphics.Paint p = new android.graphics.Paint(android.graphics.Paint.ANTI_ALIAS_FLAG);

                  LockIcon(boolean open, int color, int size) {
                      this.open = open;
                      this.size = size;
                      p.setColor(color);
                  }

                  @Override public void draw(android.graphics.Canvas c) {
                      android.graphics.Rect b = getBounds();
                      float w = b.width(), h = b.height();
                      c.save();
                      c.translate(b.left, b.top);
                      p.setStyle(android.graphics.Paint.Style.FILL);
                      c.drawRoundRect(new android.graphics.RectF(0.16f * w, 0.48f * h, 0.84f * w, 0.94f * h), 0.12f * w, 0.12f * w, p);
                      p.setStyle(android.graphics.Paint.Style.STROKE);
                      p.setStrokeWidth(0.11f * w);
                      p.setStrokeCap(android.graphics.Paint.Cap.ROUND);
                      float top = open ? 0.04f : 0.12f;
                      float legTop = open ? 0.24f : 0.32f;
                      c.drawArc(new android.graphics.RectF(0.30f * w, top * h, 0.70f * w, (top + 0.40f) * h), 180, 180, false, p);
                      c.drawLine(0.30f * w, legTop * h, 0.30f * w, 0.50f * h, p);
                      if (!open) c.drawLine(0.70f * w, legTop * h, 0.70f * w, 0.50f * h, p);
                      c.restore();
                  }

                  @Override public int getIntrinsicWidth() { return size; }
                  @Override public int getIntrinsicHeight() { return size; }
                  @Override public void setAlpha(int a) { p.setAlpha(a); }
                  @Override public void setColorFilter(android.graphics.ColorFilter f) { p.setColorFilter(f); }
                  @Override public int getOpacity() { return android.graphics.PixelFormat.TRANSLUCENT; }
              }
