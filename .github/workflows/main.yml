          public class LockActivity extends AppCompatActivity {
              private String pkg = "";
              private LockPanel panel;

              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().getDecorView().setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                  panel = new LockPanel(this, false, new Runnable() {
                      @Override public void run() { success(); }
                  });
                  setContentView(panel);
                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override public void handleOnBackPressed() { goHome(); }
                  });
                  init(getIntent());
              }

              @Override protected void onNewIntent(Intent in) {
                  super.onNewIntent(in);
                  setIntent(in);
                  init(in);
              }

              private void init(Intent in) {
                  pkg = in.getStringExtra("pkg");
                  if (pkg == null) pkg = "";
                  String label = pkg;
                  Drawable ic = null;
                  if (pkg.startsWith("feat:")) {
                      label = Prefs.featTitle(pkg);
                      ic = getResources().getDrawable(android.R.drawable.ic_lock_lock, getTheme());
                  } else {
                      try {
                          PackageManager pm = getPackageManager();
                          label = pm.getApplicationLabel(pm.getApplicationInfo(pkg, 0)).toString();
                          ic = pm.getApplicationIcon(pkg);
                      } catch (Exception ignored) { }
                  }
                  panel.bind(label, ic);
                  panel.start();
              }

              @Override protected void onResume() {
                  super.onResume();
                  Guard.hideCover();
                  Guard.lockPkg = pkg;
                  panel.resumeCheck();
              }

              @Override protected void onDestroy() {
                  super.onDestroy();
                  Guard.hideCover();
                  if (pkg.equals(Guard.lockPkg)) Guard.lockPkg = null;
              }

              @Override protected void onUserLeaveHint() {
                  super.onUserLeaveHint();
                  Guard.lockPkg = null;
                  finish();
              }

              private void goHome() {
                  Guard.lockPkg = null;
                  Intent h = new Intent(Intent.ACTION_MAIN);
                  h.addCategory(Intent.CATEGORY_HOME);
                  h.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  startActivity(h);
                  finish();
              }

              private void success() {
                  if (pkg.startsWith("feat:")) Guard.allow(pkg, 90000);
                  else Guard.unlocked = pkg;
                  Guard.lockPkg = null;
                  finish();
              }
          }
