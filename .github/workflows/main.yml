              private boolean adminActive() {
                  DevicePolicyManager dpm = (DevicePolicyManager) getSystemService(DEVICE_POLICY_SERVICE);
                  return dpm != null && dpm.isAdminActive(new ComponentName(this, AdminReceiver.class));
              }

              private boolean protectOn() {
                  return Prefs.protectSelf(this) && adminActive();
              }

              private void toggleProtect() {
                  ComponentName cn = new ComponentName(this, AdminReceiver.class);
                  DevicePolicyManager dpm = (DevicePolicyManager) getSystemService(DEVICE_POLICY_SERVICE);
                  if (dpm == null) {
                      toast("این گوشی از این قابلیت پشتیبانی نمی‌کند");
                      return;
                  }
                  if (dpm.isAdminActive(cn)) {
                      try { dpm.removeActiveAdmin(cn); } catch (Exception ignored) { }
                      Prefs.setProtectSelf(this, false);
                      LockAccessibility.reconfig();
                      toast("جلوگیری از حذف خاموش شد");
                  } else {
                      leaving = true;
                      Intent i = new Intent(DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN);
                      i.putExtra(DevicePolicyManager.EXTRA_DEVICE_ADMIN, cn);
                      i.putExtra(DevicePolicyManager.EXTRA_ADD_EXPLANATION,
                              "با فعال شدن این گزینه، «قفل برنامه» قابل حذف نیست؛ مگر اینکه ابتدا این گزینه را خاموش کنید.");
                      startActivityForResult(i, 104);
                  }
              }

