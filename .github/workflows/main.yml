          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.applock.pro'
              compileSdk 34

              defaultConfig {
                  applicationId "com.applock.pro"
                  minSdk 26
                  targetSdk 34
                  versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
                  versionName "1.0"
              }

              signingConfigs {
                  fixed {
                      storeFile file('fixed.jks')
                      storePassword 'applock123'
                      keyAlias 'applock'
                      keyPassword 'applock123'
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.fixed
                  }
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.fixed
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.biometric:biometric:1.1.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
          }
