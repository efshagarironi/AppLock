          package com.applock.pro;

          import android.content.Context;
          import android.graphics.Typeface;
          import android.graphics.drawable.Drawable;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import androidx.appcompat.app.AppCompatActivity;
          import androidx.biometric.BiometricManager;
          import androidx.biometric.BiometricPrompt;
          import androidx.core.content.ContextCompat;

          // Lock screen UI + authentication logic, used as an overlay window over locked apps
          // and inside MainActivity (opening the lock app itself, with no activity switch).
          public class LockPanel extends LinearLayout {
              private final AppCompatActivity act;
              private final boolean self;
              private final Runnable onSuccess;
              private ImageView icon;
              private TextView title, status;
              private PatternView pv;
              private LinearLayout row;
              private String label = "";
              private boolean prompting = false;

              private int dp(int v) { return Prefs.dp(getContext(), v); }

              private TextView tv(int sp, int color, boolean bold) {
                  TextView t = new TextView(getContext());
                  t.setTextSize(sp);
                  t.setTextColor(color);
                  t.setGravity(Gravity.CENTER);
                  t.setPadding(0, dp(12), 0, 0);
                  if (bold) t.setTypeface(null, Typeface.BOLD);
                  return t;
              }

              public LockPanel(AppCompatActivity a, boolean self, Runnable ok) {
                  this(a, a, self, ok);
              }

              public LockPanel(Context ctx, AppCompatActivity a, boolean self, Runnable ok) {
                  super(ctx);
                  this.act = a;
                  this.self = self;
                  this.onSuccess = ok;
                  setOrientation(VERTICAL);
                  setGravity(Gravity.CENTER);
                  setBackgroundColor(0xFF0F1B2D);
                  setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                  setPadding(dp(24), dp(24), dp(24), dp(24));

                  icon = new ImageView(ctx);
                  addView(icon, new LinearLayout.LayoutParams(dp(88), dp(88)));
                  icon.setOnClickListener(new View.OnClickListener() {
                      @Override public void onClick(View v) { start(); }
                  });

                  title = tv(20, 0xFFFFFFFF, true);
                  addView(title);
                  status = tv(14, 0xFFB0BEC5, false);
                  addView(status);

                  pv = new PatternView(ctx);
                  LinearLayout.LayoutParams plp = new LinearLayout.LayoutParams(dp(280), dp(280));
                  plp.topMargin = dp(16);
                  addView(pv, plp);
                  pv.setVisibility(View.GONE);
                  pv.listener = new PatternView.Listener() {
                      @Override public void onDone(String code) {
                          if (Prefs.checkPattern(getContext(), code)) {
                              onSuccess.run();
                          } else {
                              status.setText("الگوی اشتباه است");
                              pv.clearLater();
                          }
                      }
                  };

                  row = new LinearLayout(ctx);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams rlp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  rlp.topMargin = dp(24);
                  addView(row, rlp);
                  for (int i = 0; i < 3; i++) {
                      final int m = i;
                      Button bt = new Button(ctx);
                      bt.setText(Prefs.METHODS[i]);
                      bt.setOnClickListener(new View.OnClickListener() {
                          @Override public void onClick(View v) { use(m); }
                      });
                      row.addView(bt, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));
                  }
                  row.setVisibility(View.GONE);
              }

              public void bind(String label, Drawable ic) {
                  this.label = label;
                  icon.setImageDrawable(ic);
                  title.setText(self ? "ورود به «قفل برنامه»" : label + " قفل است");
                  status.setText("");
              }

              public void start() {
                  if (act == null && !self) {
                      // overlay: the pattern is ready at once, fingerprint / face start only when their button is tapped
                      prompting = false;
                      showPattern();
                      return;
                  }
                  use(self ? Prefs.selfMethod(getContext()) : Prefs.appMethod(getContext()));
              }

              // Called from onResume: re-open the prompt if the system cancelled it.
              public void resumeCheck() {
                  if (!prompting && pv.getVisibility() != View.VISIBLE) start();
              }

              public void fallbackPattern(String msg) {
                  prompting = false;
                  showPattern();
                  if (msg != null) status.setText(msg);
              }

              // Overlay mode: the back key goes to the home screen instead of the locked app.
              @Override public boolean dispatchKeyEvent(android.view.KeyEvent e) {
                  if (act == null && !self && e.getKeyCode() == android.view.KeyEvent.KEYCODE_BACK) {
                      if (e.getAction() == android.view.KeyEvent.ACTION_UP) Guard.goHome(getContext());
                      return true;
                  }
                  return super.dispatchKeyEvent(e);
              }

              private void use(int m) {
                  if (m == 2) {
                      showPattern();
                  } else {
                      pv.setVisibility(View.GONE);
                      row.setVisibility(View.GONE);
                      prompt(m == 1);
                  }
              }

              private void showPattern() {
                  pv.setVisibility(View.VISIBLE);
                  pv.clear();
                  status.setText("الگو را بکشید");
                  row.setVisibility(View.VISIBLE);
              }

              @android.annotation.SuppressLint("NewApi")
              private void promptDirect() {
                  if (android.os.Build.VERSION.SDK_INT < 28) {
                      showPattern();
                      status.setText("اثر انگشت/چهره در این نسخه اندروید پشتیبانی نمی‌شود؛ الگو را بکشید");
                      return;
                  }
                  try {
                      android.hardware.biometrics.BiometricPrompt.Builder b =
                              new android.hardware.biometrics.BiometricPrompt.Builder(getContext())
                                      .setTitle("باز کردن " + label)
                                      .setSubtitle("چهره، اثر انگشت یا الگو");
                      if (android.os.Build.VERSION.SDK_INT >= 30) {
                          b.setAllowedAuthenticators(BiometricManager.Authenticators.BIOMETRIC_WEAK);
                          b.setConfirmationRequired(false);
                      }
                      final java.util.concurrent.Executor ex = ContextCompat.getMainExecutor(getContext());
                      b.setNegativeButton("استفاده از الگو", ex, new android.content.DialogInterface.OnClickListener() {
                          @Override public void onClick(android.content.DialogInterface d, int w) {
                              prompting = false;
                              showPattern();
                          }
                      });
                      android.hardware.biometrics.BiometricPrompt bp = b.build();
                      prompting = true;
                      bp.authenticate(new android.os.CancellationSignal(), ex,
                              new android.hardware.biometrics.BiometricPrompt.AuthenticationCallback() {
                                  @Override public void onAuthenticationSucceeded(
                                          android.hardware.biometrics.BiometricPrompt.AuthenticationResult r) {
                                      prompting = false;
                                      onSuccess.run();
                                  }

                                  @Override public void onAuthenticationError(int code, CharSequence msg) {
                                      prompting = false;
                                      showPattern();
                                      // 5 = canceled by system, 10 = user canceled: just show the pattern
                                      if (code != 5 && code != 10 && code != 13) status.setText(msg);
                                  }
                              });
                  } catch (Throwable t) {
                      prompting = false;
                      showPattern();
                      status.setText("اثر انگشت/چهره در دسترس نیست؛ الگو را بکشید");
                  }
              }

              private void prompt(final boolean face) {
                  if (prompting) return;
                  int auth = BiometricManager.Authenticators.BIOMETRIC_WEAK;
                  int can = BiometricManager.from(getContext()).canAuthenticate(auth);
                  if (can != BiometricManager.BIOMETRIC_SUCCESS) {
                      showPattern();
                      status.setText("چهره یا اثر انگشتی ثبت نشده یا پشتیبانی نمی‌شود؛ الگو را بکشید");
                      return;
                  }
                  if (act == null) {
                      // overlay mode: the system dialog is shown directly, no activity / task is created
                      promptDirect();
                      return;
                  }
                  BiometricPrompt.PromptInfo info = new BiometricPrompt.PromptInfo.Builder()
                          .setTitle(self ? "ورود به قفل برنامه" : "باز کردن " + label)
                          .setSubtitle("چهره، اثر انگشت یا الگو")
                          .setNegativeButtonText("استفاده از الگو")
                          .setAllowedAuthenticators(auth)
                          .setConfirmationRequired(false)
                          .build();
                  prompting = true;
                  new BiometricPrompt(act, ContextCompat.getMainExecutor(act),
                          new BiometricPrompt.AuthenticationCallback() {
                              @Override public void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult r) {
                                  prompting = false;
                                  onSuccess.run();
                              }

                              @Override public void onAuthenticationError(int code, CharSequence msg) {
                                  prompting = false;
                                  if (code == BiometricPrompt.ERROR_NEGATIVE_BUTTON
                                          || code == BiometricPrompt.ERROR_USER_CANCELED) {
                                      showPattern();
                                  } else if (code != BiometricPrompt.ERROR_CANCELED) {
                                      showPattern();
                                      status.setText(msg);
                                  }
                              }
                          }).authenticate(info);
              }
          }
