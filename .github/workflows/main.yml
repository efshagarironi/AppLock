                      "com.sec.android.app.samsungapps", "com.xiaomi.mipicks", "com.xiaomi.market",
                      "com.huawei.appmarket", "com.aurora.store", "org.fdroid.fdroid");

              // All word lists are normalized (lower case, no spaces / hyphens / ZWNJ) by norm().
              private static final String[] NET = norm("wi-fi", "wifi", "وای‌فای", "internet", "اینترنت", "mobile data",
                      "cellular data", "داده تلفن همراه", "داده همراه", "داده موبایل", "airplane", "flight mode", "حالت پرواز");
              private static final String[] SET_NET = norm("wi-fi", "wifi", "وای‌فای", "internet", "اینترنت", "mobile network",
                      "mobile data", "data usage", "شبکه تلفن همراه", "مصرف داده", "airplane", "flight mode", "حالت پرواز",
                      "connections", "اتصالات");
              private static final String[] ADMIN = norm("device admin", "مدیر دستگاه", "مدیران دستگاه");
              private static final String[] STORE_BTN = norm("install", "update", "get", "download",
                      "نصب", "به‌روزرسانی", "بروزرسانی", "دریافت", "دانلود");
              private static final String[] IMG = norm("download image", "save image", "download photo", "save photo",
