              // ---------- permissions ----------
              private void refreshPerms() {
                  if (banner == null) return;
                  boolean overlay = Settings.canDrawOverlays(this);
                  boolean acc = Prefs.accEnabled(this);
                  boolean ok = overlay && (Prefs.accMode(this) ? acc : Prefs.hasUsage(this)) && (!Prefs.anyFeat(this) || acc);
                  banner.setVisibility(ok ? View.GONE : View.VISIBLE);
                  if (overlay && (acc || Prefs.hasUsage(this)) && !LockService.running) {
                      startForegroundService(new Intent(this, LockService.class));
                  }
                  if (ok) {
                      if (Build.VERSION.SDK_INT >= 33 && !askedNotif
                              && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          askedNotif = true;
                          requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 1);
                      }
                  } else if (!asked) {
                      asked = true;
                      requestNext();
                  }
              }

              private void requestNext() {
                  if (!Settings.canDrawOverlays(this)) {
                      ask("نمایش روی سایر برنامه‌ها",
                              "برای نمایش صفحه قفل روی برنامه‌های قفل‌شده این دسترسی لازم است. در صفحه بعد «قفل برنامه» را روشن کنید.",
                              new Runnable() {
                                  @Override public void run() {
                                      leaving = true;
                                      startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                              Uri.parse("package:" + getPackageName())));
                                  }
                              });
                  } else if (!Prefs.accMode(this) && !Prefs.hasUsage(this)) {
                  ask("دسترسی به آمار استفاده",
                          "برای تشخیص اینکه کدام برنامه باز شده این دسترسی لازم است. در صفحه بعد «قفل برنامه» را پیدا و روشن کنید. (با روشن کردن «حالت دسترس‌پذیری» در تنظیمات، باز شدن قفل سریع‌تر می‌شود.)",
                          new Runnable() {
                              @Override public void run() {
                                  leaving = true;
                                  startActivity(new Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS));
                              }
                          });
              } else if ((Prefs.accMode(this) || Prefs.anyFeat(this)) && !Prefs.accEnabled(this)) {
                      ask("سرویس دسترسی‌پذیری",
                              "برای اینکه صفحه قفل بدون هیچ تأخیری و قبل از دیده شدن برنامه باز شود، این سرویس لازم است. در صفحه بعد «قفل برنامه» را پیدا و روشن کنید. هیچ اطلاعاتی ذخیره یا ارسال نمی‌شود.\n\nاگر گزینه خاکستری بود: تنظیمات گوشی > برنامه‌ها > قفل برنامه > منوی ⋮ بالا > «اجازه تنظیمات محدودشده» را بزنید و دوباره تلاش کنید.",
                              new Runnable() {
                                  @Override public void run() {
                                      leaving = true;
                                      startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                                  }
                              });
                  }
              }

