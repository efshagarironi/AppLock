          package com.applock.pro;

          import android.accessibilityservice.AccessibilityService;
          import android.view.accessibility.AccessibilityEvent;

          // Instant detection of the app that comes to the front. No activity is ever started:
          // the only thing this service does is tell Guard which package is in front.
          public class AppLockAccess extends AccessibilityService {
              static volatile boolean live = false;
              static volatile AppLockAccess instance = null;

              @Override protected void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
                  live = true;
                  Guard.warm(this);
                  Guard.cacheIcons(this);
              }

              @Override public void onAccessibilityEvent(AccessibilityEvent e) {
                  if (e == null || e.getEventType() != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return;
                  CharSequence pk = e.getPackageName();
                  if (pk == null) return;
                  CharSequence cn = e.getClassName();
                  if (cn != null) {
                      String c = cn.toString();
                      // popups / menus / toasts of an app are not a new app coming to the front
                      if (c.startsWith("android.widget.") || c.startsWith("android.view.")) return;
                  }
                  Guard.onFg(this, pk.toString(), System.currentTimeMillis());
              }

              @Override public void onInterrupt() { }

              @Override public boolean onUnbind(android.content.Intent i) {
                  live = false;
                  instance = null;
                  Guard.hideLock();
                  return super.onUnbind(i);
              }

              @Override public void onDestroy() {
                  live = false;
                  instance = null;
                  super.onDestroy();
              }
          }
